<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title summary">
  <title id="title">Rink Analyzer footage application architecture</title>
  <desc id="summary">The Pi serves the footage site and stores originals, track jobs, skater IDs, and reviewed exports. Furulid pulls tracking jobs and sends back ID previews and timestamped tracks. Checked rink landmarks and coaching cues join the saved track in the Rust renderer. The Pi publishes the Coaching Film Room, montage, and editable plays. An experimental rink landmark model on Furulid can propose landmarks for review.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#1d4237" stroke-opacity=".065"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="m1 1 6.5 3.5L1 8" fill="none" stroke="#356752" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="check-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="m1 1 6.5 3.5L1 8" fill="none" stroke="#9c732e" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b2f27; }
      .display { font-size: 48px; font-weight: 740; letter-spacing: -1.8px; }
      .lead { font-size: 21px; fill: #476056; }
      .band { font-size: 17px; fill: #356752; font-weight: 730; letter-spacing: 2.1px; }
      .title { font-size: 27px; font-weight: 730; letter-spacing: -.45px; }
      .body { font-size: 18px; fill: #3f564d; }
      .small { font-size: 16px; fill: #466055; }
      .chip { font-size: 14px; font-weight: 730; letter-spacing: .65px; }
      .edge-label { font-size: 15px; font-weight: 650; fill: #356752; }
      .review-label { font-size: 15px; font-weight: 650; fill: #825e23; }
      .foot { font-size: 15px; fill: #52695f; }
      .edge { fill: none; stroke: #356752; stroke-width: 2.1; stroke-linejoin: round; marker-end: url(#arrow); }
      .proposed { fill: none; stroke: #9c732e; stroke-width: 2; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#check-arrow); }
      .card { fill: #fffefa; stroke: #bdcec1; stroke-width: 1.5; }
      .strong-card { fill: #f1f7f2; stroke: #9ab7a5; stroke-width: 1.5; }
      .review-card { fill: #fff8e7; stroke: #d5b77c; stroke-width: 1.5; }
      .output { font-size: 18px; font-weight: 690; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="#fbfaf4"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>
  <rect x="61" y="43" width="159" height="29" rx="14.5" fill="#214937"/>
  <text x="141" y="63" text-anchor="middle" class="chip" style="fill:#fffefa">RINK ANALYZER</text>
  <text x="60" y="122" class="display">From footage to the Coaching Film Room</text>
  <text x="63" y="157" class="lead">The Pi runs the web app. Furulid runs GPU detection. Reviewed geometry drives the final export.</text>

  <text x="63" y="211" class="band">UPLOAD AND TRACK</text>
  <path d="M275 205H1540" stroke="#c5d2c8" stroke-width="1.5"/>

  <rect x="62" y="235" width="324" height="188" rx="14" class="card"/>
  <rect x="80" y="254" width="90" height="25" rx="12.5" fill="#e8f1eb"/>
  <text x="125" y="272" text-anchor="middle" class="chip" fill="#315b48">BROWSER</text>
  <text x="81" y="313" class="title">Phone or desktop</text>
  <text x="82" y="345" class="body">
    <tspan x="82">Upload hockey clips</tspan>
    <tspan x="82" dy="25">Open the shared session list</tspan>
    <tspan x="82" dy="25">Pick your skater and correct IDs</tspan>
  </text>

  <rect x="574" y="235" width="452" height="188" rx="14" class="strong-card"/>
  <rect x="593" y="254" width="65" height="25" rx="12.5" fill="#dcebe0"/>
  <text x="625" y="272" text-anchor="middle" class="chip">HOST</text>
  <text x="593" y="313" class="title">Raspberry Pi</text>
  <text x="594" y="345" class="body">
    <tspan x="594">Caddy serves the Rust API over Tailscale</tspan>
    <tspan x="594" dy="25">Decode upright previews and queue tracking jobs</tspan>
    <tspan x="594" dy="25">Store originals, tracks, selections, and exports</tspan>
  </text>

  <rect x="1214" y="235" width="324" height="188" rx="14" class="card"/>
  <rect x="1233" y="254" width="100" height="25" rx="12.5" fill="#e8f1eb"/>
  <text x="1283" y="272" text-anchor="middle" class="chip">RTX 4070</text>
  <text x="1233" y="313" class="title">Furulid worker</text>
  <text x="1234" y="345" class="body">
    <tspan x="1234">Pull jobs and run YOLOX on the GPU</tspan>
    <tspan x="1234" dy="25">Rust links boxes into clip-local IDs</tspan>
    <tspan x="1234" dy="25">Encode the annotated preview</tspan>
  </text>

  <text x="480" y="293" text-anchor="middle" class="edge-label">Upload clips</text>
  <path d="M386 306H568" class="edge"/>
  <text x="480" y="346" text-anchor="middle" class="edge-label">Previews + sessions</text>
  <path d="M574 359H392" class="edge"/>
  <text x="1120" y="293" text-anchor="middle" class="edge-label">Claimed job + source</text>
  <path d="M1026 306H1208" class="edge"/>
  <text x="1120" y="346" text-anchor="middle" class="edge-label">MP4 + track data</text>
  <path d="M1214 359H1032" class="edge"/>

  <path d="M660 423v40H355v83" class="edge"/>
  <path d="M1375 423v24" fill="none" stroke="#9c732e" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="1214" y="447" width="324" height="45" rx="9" fill="#fff8e7" stroke="#c3a164" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="1376" y="476" text-anchor="middle" class="review-label">HockeyRink model · tested on Furulid</text>
  <path d="M1214 470H945v76" class="proposed"/>
  <text x="1052" y="460" text-anchor="middle" class="review-label">Candidate landmarks</text>

  <text x="63" y="515" class="band">REVIEW AND RENDER</text>
  <path d="M294 509H1538" stroke="#c5d2c8" stroke-width="1.5"/>

  <rect x="62" y="552" width="324" height="171" rx="14" class="card"/>
  <text x="82" y="593" class="title">Saved skater selection</text>
  <text x="82" y="626" class="body">
    <tspan x="82">Browser confirms an ID at a frame.</tspan>
    <tspan x="82" dy="25">Corrections carry across devices.</tspan>
  </text>
  <text x="82" y="694" class="small">Includes timestamped skater tracks.</text>

  <rect x="574" y="552" width="452" height="171" rx="14" class="review-card"/>
  <text x="594" y="593" class="title">Checked landmarks and cues</text>
  <text x="594" y="626" class="body">
    <tspan x="594">Choose source windows and verify rink orientation.</tspan>
    <tspan x="594" dy="25">Write cues for what the footage supports.</tspan>
  </text>
  <text x="594" y="694" class="review-label">This step still needs review.</text>

  <rect x="1214" y="552" width="324" height="171" rx="14" class="strong-card"/>
  <text x="1234" y="593" class="title">Rust review builder</text>
  <text x="1234" y="626" class="body">
    <tspan x="1234">Project skates onto the rink</tspan>
    <tspan x="1234" dy="25">Validate suggested routes</tspan>
    <tspan x="1234" dy="25">Render freezes, arrows, and replay</tspan>
  </text>

  <path d="M386 673H568" class="edge"/>
  <text x="480" y="661" text-anchor="middle" class="edge-label">Track + chosen IDs</text>
  <path d="M1026 673H1208" class="edge"/>
  <text x="1120" y="661" text-anchor="middle" class="edge-label">Reviewed inputs</text>

  <path d="M1376 723v43H801v36" class="edge"/>
  <text x="989" y="756" class="edge-label">Publish export to the saved session on the Pi</text>

  <rect x="62" y="809" width="1476" height="126" rx="14" class="strong-card"/>
  <rect x="80" y="826" width="112" height="25" rx="12.5" fill="#dcebe0"/>
  <text x="136" y="844" text-anchor="middle" class="chip">AVAILABLE</text>
  <text x="82" y="882" class="output">Coaching Film Room</text>
  <text x="82" y="908" class="small">Stacked footage and rink, synchronized timeline, and feedback</text>
  <path d="M672 848v65M1025 848v65" fill="none" stroke="#bbd0c3" stroke-width="1.4"/>
  <text x="700" y="882" class="output">Annotated montage</text>
  <text x="700" y="908" class="small">A single downloadable MP4</text>
  <text x="1053" y="882" class="output">Editable rink-analyzer plays</text>
  <text x="1053" y="908" class="small">Sequences and positioning suggestions</text>

  <path d="M64 969h42" class="edge"/>
  <text x="118" y="974" class="foot">Live pipeline</text>
  <path d="M260 969h42" class="proposed"/>
  <text x="314" y="974" class="foot">Experimental landmark proposals</text>
  <text x="1536" y="974" text-anchor="end" class="foot">A changed skater selection marks its export for rebuilding.</text>
</svg>
