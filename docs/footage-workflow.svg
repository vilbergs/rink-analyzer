<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">From hockey footage to an editable rink replay</title>
  <desc id="description">Four connected stages show a practice video, timestamped JPEGs decoded by rink-footage, skaters manually plotted on rink coordinates, and an editable replay validated by rink check. An inset maps a ten-second example around the goal, including a dashed interpolated segment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#698098" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #141e30 }
      .heading { font-weight: 720; font-size: 37px }
      .stage { font-weight: 700; font-size: 20px }
      .body { font-size: 15px; fill: #40536c }
      .mono { font: 13px ui-monospace, monospace; fill: #3c5270 }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #40536c }
      .small { font-size: 13px; fill: #40536c }
      .card { fill: white; stroke: #d7e2ec }
      .rink { fill: #f6fbff; stroke: #9cb6cc; stroke-width: 1.4 }
      .orange { fill: #c6502a }
      .dark { fill: #252b38 }
      .line { fill: none; stroke: #698098; stroke-width: 2; marker-end: url(#arrow) }
    </style>
  </defs>

  <rect width="1200" height="670" fill="#edf4fa"/>
  <text x="42" y="65" class="heading">From footage to rink replay</text>
  <text x="43" y="98" class="body">Rust selects the frames. A manual review turns the visible action into editable routes.</text>

  <g transform="translate(42 132)">
    <rect class="card" width="252" height="195" rx="13"/>
    <rect x="23" y="20" width="54" height="43" rx="5" fill="#e8f1f9" stroke="#a2b8cd"/>
    <path d="m45 31 15 11-15 11z" fill="#3f658a"/>
    <text x="22" y="95" class="stage">Source video</text>
    <text x="22" y="124" class="body">Choose a short sequence</text>
    <text x="22" y="145" class="body">with usable rink landmarks.</text>
    <text x="22" y="173" class="mono">HEVC · MOV or MP4</text>
  </g>
  <path class="line" d="M299 230h20"/>

  <g transform="translate(328 132)">
    <rect class="card" width="252" height="195" rx="13"/>
    <rect x="29" y="20" width="39" height="40" rx="3" fill="#eef6fd" stroke="#b2c5d6"/>
    <rect x="23" y="25" width="39" height="40" rx="3" fill="#deecf8" stroke="#a2b8cd"/>
    <circle cx="45" cy="39" r="4" fill="#3f658a"/>
    <path d="m28 57 9-11 9 9 6-5 7 7z" fill="#a2b8cd"/>
    <text x="22" y="95" class="stage">Reference frames</text>
    <text x="22" y="124" class="body">Decode upright JPEGs by</text>
    <text x="22" y="145" class="body">video timestamp.</text>
    <text x="22" y="173" class="mono">rink-footage</text>
  </g>
  <path class="line" d="M585 230h20"/>

  <g transform="translate(614 132)">
    <rect class="card" width="252" height="195" rx="13"/>
    <rect class="rink" x="23" y="22" width="57" height="42" rx="12"/>
    <path d="M49 22v42" stroke="#cf7d89" fill="none"/>
    <path d="m36 53 20-13 12 8" stroke="#c6502a" stroke-width="2" fill="none"/>
    <circle class="orange" cx="36" cy="53" r="3"/><circle class="orange" cx="56" cy="40" r="3"/><circle class="orange" cx="68" cy="48" r="3"/>
    <text x="22" y="95" class="stage">Manual rink trace</text>
    <text x="22" y="124" class="body">Plot skate positions in meters.</text>
    <text x="22" y="145" class="body">Mark uncertain stretches.</text>
    <text x="22" y="173" class="mono">keyframes · captions</text>
  </g>
  <path class="line" d="M871 230h20"/>

  <g transform="translate(900 132)">
    <rect class="card" width="252" height="195" rx="13"/>
    <rect x="23" y="20" width="54" height="43" rx="5" fill="#e9f6f0" stroke="#a2c8b6"/>
    <path d="m38 42 8 8 16-17" fill="none" stroke="#31765b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="95" class="stage">Editable replay</text>
    <text x="22" y="124" class="body">Validate the play, then scrub</text>
    <text x="22" y="145" class="body">or edit it in rink-analyzer.</text>
    <text x="22" y="173" class="mono">rink check · .rink.json</text>
  </g>

  <rect class="card" x="42" y="357" width="1110" height="272" rx="13"/>
  <text class="eyebrow" x="66" y="398">RECONSTRUCTION FROM IMG_2900.MOV</text>
  <text class="stage" x="66" y="434">Ten seconds around the practice net</text>
  <text class="body" x="66" y="463">Source 00:05–00:15 · two skaters</text>
  <path d="M68 502h34" stroke="#c6502a" stroke-width="3" stroke-linecap="round"/>
  <text class="body" x="113" y="508">Orange skater’s route</text>
  <path d="M68 530h34" stroke="#252b38" stroke-width="3" stroke-linecap="round"/>
  <text class="body" x="113" y="536">Dark skater’s route</text>
  <path d="M68 558h34" stroke="#252b38" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
  <text class="body" x="113" y="564">Interpolated while out of view</text>
  <text class="small" x="66" y="598">Rink positions are approximate. Puck possession was unclear.</text>

  <g transform="translate(560 393)">
    <path class="rink" d="M5 0h491q57 0 57 52v93q0 52-57 52H5q-5 0-5-5V5q0-5 5-5z"/>
    <path d="M485 0v197" stroke="#d98493" opacity=".55"/>
    <path d="M485 86h12v25h-12m0 2a15 15 0 0 1 0-29" fill="#dbefff" stroke="#b26a78" stroke-width="1.5"/>
    <circle cx="375" cy="52" r="30" fill="none" stroke="#e0acb4"/>
    <circle cx="375" cy="145" r="30" fill="none" stroke="#e0acb4"/>
    <path d="M349 93C400 89 449 86 472 75C492 66 505 48 508 33C512 21 522 22 525 35C523 45 513 50 501 55C482 62 461 67 444 73" fill="none" stroke="#c6502a" stroke-width="3" stroke-linecap="round"/>
    <path d="M453 39Q478 60 491 82Q494 79 476 74M494 68Q507 75 504 83" fill="none" stroke="#252b38" stroke-width="3" stroke-linecap="round"/>
    <path d="M476 74l18-6" fill="none" stroke="#252b38" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round"/>
    <circle class="orange" cx="349" cy="93" r="4"/>
    <circle class="dark" cx="453" cy="39" r="4"/>
    <text class="small" x="228" y="110">Start near the slot</text>
    <text class="small" x="365" y="20">Turn along the boards</text>
    <path d="m500 19 14 8" stroke="#698098"/>
    <text class="small" x="14" y="174">End-zone schematic</text>
  </g>
</svg>
