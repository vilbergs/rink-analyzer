[package]
name = "rink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Play model, interpolation and file format for Rink Replay. No UI dependencies."

[dependencies]
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
uuid.workspace = true
thiserror.workspace = true
directories = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random play ids in the browser come from crypto.getRandomValues.
uuid = { workspace = true, features = ["js"] }

[features]
default = ["std"]
# The library folder, play and review files on disk, and the app session files.
std = ["dep:directories"]
