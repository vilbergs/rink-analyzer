[package]
name = "rink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rink Replay desktop editor (GPUI)."

[[bin]]
name = "rink-replay"
path = "src/main.rs"

[dependencies]
rink-core.workspace = true
gpui = "=0.2.2"
anyhow.workspace = true
env_logger = "0.11"
log = "0.4"
futures = "0.3"
unicode-segmentation = "1"

[dev-dependencies]
# The headless test platform, for driving the workspace with keystrokes.
gpui = { version = "=0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Trackpad pinch: GPUI doesn't forward magnify gestures yet (see src/pinch.rs).
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"
